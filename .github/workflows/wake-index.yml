name: wake-index

# 本仓库是 iJetLi/dsh-providers-hub 的 fork，**只做一件事：叫醒索引仓库**
# gitMFQ/dsh-plugin-index。
#
# 为什么需要它
# ------------
# 索引仓库用 GitHub `schedule` 定时轮询上游，但 GitHub 明确不保证 schedule 精度，
# 高负载时会延迟甚至**丢弃**排队任务 —— 实测出现过 1.8h / 3.7h / 5h 的间隔，
# 而 cron 写的是 10 分钟。本仓库有写权限，可以主动发 `repository_dispatch`，
# 让索引在上游一推就跟上，不依赖单条 cron 的运气。
#
# 为什么本 fork **不**承载内容
# ----------------------------
# 早先的写法是「把上游快进到本 fork，再让索引读本 fork」，但那样**永远无法快进**：
# 本仓库必须存放这个 workflow 文件，于是 fork 总比上游多一个 commit，
# 快进关系恒不成立。所以改成：
# - **检测源仍是上游镜像** `iJetLi/dsh-providers-hub`（索引已按此配置）；
# - 本 fork 只当**哨兵**，不参与内容分发，也就不会和上游产生分叉冲突。
#
# 需要的 secret
# -------------
# `INDEX_WAKE_TOKEN`：对 gitMFQ/dsh-plugin-index 有 `contents: write` 的 PAT
# （fine-grained 选 Actions: write 亦可；classic PAT 需 `repo`）。
# 未配置时**不失败**，只跳过唤醒并给 warning。

on:
  schedule:
    # 错开整点（:05/:15/…），降低被限流的概率。
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-index
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 核对上游 HEAD 与索引已收录的 commit
        id: check
        env:
          UPSTREAM: iJetLi/dsh-providers-hub
          INDEX: gitMFQ/dsh-plugin-index
          PLUGIN: dsh-providers-hub
        run: |
          set -euo pipefail

          upstream_sha=$(curl -sSf -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${UPSTREAM}/commits/master" | jq -r '.sha')
          echo "上游 HEAD: $upstream_sha"

          # 索引里该插件最新一条的 commit；取不到（网络抖动 / 格式变动）就当作「需要唤醒」，
          # 因为多发一次 dispatch 只是让索引多跑一次幂等同步，代价远小于漏掉更新。
          indexed_sha=$(curl -sSf "https://raw.githubusercontent.com/${INDEX}/master/plugin-market.json" \
            | jq -r --arg name "$PLUGIN" \
              '.plugins[] | select(.name==$name) | .versions[0].source.commit' 2>/dev/null || echo '')
          echo "索引已收录: ${indexed_sha:-<读取失败>}"

          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$indexed_sha" ] && [ "$indexed_sha" = "$upstream_sha" ]; then
            echo "索引已是最新，无需唤醒"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "需要唤醒索引"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 叫醒索引仓库
        if: steps.check.outputs.needed == 'true'
        env:
          WAKE_TOKEN: ${{ secrets.INDEX_WAKE_TOKEN }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WAKE_TOKEN:-}" ]; then
            echo "::warning::未配置 INDEX_WAKE_TOKEN，跳过唤醒；索引仍靠自己的 schedule 轮询"
            exit 0
          fi

          payload=$(jq -n --arg sha "$SHA" --arg source "$GITHUB_REPOSITORY" \
            '{event_type:"wake-index", client_payload:{sha:$sha, source:$source}}')

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${WAKE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/gitMFQ/dsh-plugin-index/dispatches \
            -d "$payload")

          if [ "$code" != "204" ]; then
            echo "::error::唤醒失败（HTTP $code）：$(cat /tmp/resp.json)"
            exit 1
          fi
          echo "已通知索引仓库（HTTP 204）"

      - name: 汇总
        env:
          NEEDED: ${{ steps.check.outputs.needed }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          {
            echo "### 索引唤醒"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 commit | \`${SHA}\` |"
            echo "| 是否需要唤醒 | \`${NEEDED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
