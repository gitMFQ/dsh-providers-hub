name: sync-fork-and-wake-index

# 本仓库是 iJetLi/dsh-providers-hub 的 fork，只做一件事：
# 把上游镜像**同步到本 fork**，同步完成后**叫醒索引仓库** gitMFQ/dsh-plugin-index。
#
# 为什么需要它
# ------------
# 索引仓库用 GitHub `schedule` 定时轮询上游，但 GitHub 明确不保证 schedule 精度，
# 高负载时会延迟甚至**丢弃**排队任务 —— 实测出现过 1.8h / 3.7h / 5h 的间隔。
# 本仓库有写权限，可以主动发 `repository_dispatch`，让索引在**上游一推**就跟上，
# 不依赖 cron 的运气。
#
# 权限说明
# --------
# fork 不能直接往上游推，所以本工作流只做「**从上游拉**」：
# 上游有新 commit 就快进本 fork 的 master，然后叫醒索引。
# 索引侧读的是本 fork（`gitMFQ/dsh-providers-hub`），因此**本 fork 必须与上游同步**，
# 否则索引会钉在旧 commit 上 —— 这正是本工作流存在的理由。
#
# 需要的 secret
# -------------
# `INDEX_WAKE_TOKEN`：一个有 gitMFQ/dsh-plugin-index `contents: write` 权限的
# fine-grained PAT（或 classic PAT 的 `repo` scope）。只用于发 dispatch。
# 没配置时工作流**不失败**，只跳过唤醒并给出提示（fork 同步照常进行）。

on:
  schedule:
    # 每 10 分钟检查一次上游；错开整点（:05/:15/…）降低被限流的概率。
    # 即使这条被限流，索引侧仍有自己的 schedule 兜底，只是会慢。
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出本 fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 从上游快进本 fork
        id: sync
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)

          git remote add upstream https://github.com/iJetLi/dsh-providers-hub.git || true
          git fetch --depth=1 upstream master
          upstream_sha=$(git rev-parse FETCH_HEAD)

          echo "本 fork  HEAD: $before"
          echo "上游     HEAD: $upstream_sha"

          if [ "$before" = "$upstream_sha" ]; then
            echo "已是最新，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$before" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 只做快进：fork 上不应有本地提交，分叉说明有人直接改了 fork，
          # 这时硬重置会丢东西，所以显式失败让人来看。
          if ! git merge-base --is-ancestor "$before" "$upstream_sha"; then
            echo "::error::fork 与上游已分叉（不是快进关系），请人工确认后再处理"
            exit 1
          fi

          git merge --ff-only FETCH_HEAD
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: 叫醒索引仓库
        env:
          WAKE_TOKEN: ${{ secrets.INDEX_WAKE_TOKEN }}
          SHA: ${{ steps.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WAKE_TOKEN:-}" ]; then
            echo "::warning::未配置 INDEX_WAKE_TOKEN，跳过唤醒；索引仍靠自己的 schedule 轮询"
            exit 0
          fi

          # 无论 fork 是否刚更新都发一次：上游可能没动，但索引侧的 schedule 被限流了，
          # 这条 dispatch 正好补位。
          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg source "$GITHUB_REPOSITORY" \
            '{event_type:"wake-index", client_payload:{sha:$sha, source:$source}}')

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WAKE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gitMFQ/dsh-plugin-index/dispatches \
            -d "$payload")

          if [ "$code" != "204" ]; then
            echo "::error::唤醒失败（HTTP $code）：$(cat /tmp/resp.json)"
            exit 1
          fi
          echo "已通知索引仓库（HTTP 204）"

      - name: 汇总
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          SHA: ${{ steps.sync.outputs.sha }}
        run: |
          {
            echo "### fork 同步与索引唤醒"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 commit | \`${SHA}\` |"
            echo "| fork 是否更新 | \`${CHANGED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
